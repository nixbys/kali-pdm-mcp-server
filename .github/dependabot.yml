# Dependabot keeps dependencies and pinned action versions current.
#
# Every workflow in this repo pins its GitHub Actions to an exact commit SHA,
# which is safe but freezes them in time. Dependabot opens a small, reviewable
# pull request whenever a newer version exists for the Go module graph and for
# the pinned Actions themselves, so staying patched does not require manual
# tracking. Updates are grouped so a week's bumps arrive as one PR per
# ecosystem instead of a flood of separate ones.

version: 2
updates:
  # Go modules (go.mod / go.sum).
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns: ["*"]

  # The pinned action SHAs used across .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
